name: NSW Media Monitor

on:
  schedule:
    - cron: "3,8,13,18,23,28,33,38,43,48,53,58 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nsw-media-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Show browser version
        run: google-chrome --version || chromium-browser --version || chromium --version

      - name: Run NSW media monitor
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
        run: python nsw_media_bot.py

      - name: Save updated seen-release state
        run: |
          git config user.name "NSW Media Monitor"
          git config user.email "actions@users.noreply.github.com"

          git add seen_releases.json

          if git diff --cached --quiet; then
            echo "No state change to save."
          else
            git commit -m "Update seen releases"
            git push
          fi
